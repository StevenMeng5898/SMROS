[package]
name = "smros"
version = "0.1.0"
edition = "2021"
authors = ["SMROS Developers"]
build = "build.rs"

[dependencies]
bitflags = "1.3"

[target.'cfg(target_arch = "aarch64")'.dependencies]
cortex-a = "8"
tock-registers = "0.8"

[profile.dev]
panic = "abort"
incremental = true
# Default matches SMROS_BUILD_JOBS. `make` overrides both profiles from that knob.
codegen-units = 4

[profile.release]
panic = "abort"
lto = false
incremental = true
codegen-units = 4
opt-level = "s"
